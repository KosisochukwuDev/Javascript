<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="Simpcalc.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
        integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div id="input"><input type="number" id="first" class="input"><br>
        <input type="number" id="second" class="input"><br>
    </div>
    <button onclick="add()" id="add"><i class="fa-solid fa-plus"></i></button>
    <button onclick="subtract()"><i class="fa-solid fa-minus"></i></button>
    <button onclick="divide()"><i class="fa-solid fa-divide"></i></button>
    <button onclick="multiply()"><i class="fa-solid fa-xmark"></i></button><br><br><br>
    <p id="display"></p>


    <script src="Simpcalc.js"></script>
</body>

</html>
